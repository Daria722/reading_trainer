{% extends 'base.html' %}
{% block content %}
<h1 class="h3 mb-4">Выберите текст для чтения</h1>
<div class="row g-3">
  {% for t in texts %}
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ t.title }}</h5>
        <p class="text-muted">Слов: {{ t.word_count }}</p>
        <a href="{% url 'text_read' t.pk %}" class="btn btn-primary mt-auto">Читать</a>
      </div>
    </div>
  </div>
  {% empty %}
  <p>Текстов пока нет. Добавь их через админ-панель.</p>
  {% endfor %}
</div>
{% endblock %}
